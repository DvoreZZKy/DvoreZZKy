<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DvoreZZKy — профиль разработчика</title>
  <desc id="desc">Анимированный фиолетово-синий баннер с линиями кода, свечением и информацией о разработчике.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b18"/>
      <stop offset="55%" stop-color="#171331"/>
      <stop offset="100%" stop-color="#081a2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="930" cy="120" rx="350" ry="250" fill="url(#glow)">
      <animate attributeName="cx" values="900;1020;900" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M720 0L570 360M820 0L670 360M920 0L770 360" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="2"/>
    <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8">
      <path d="M780 78h82l18 18h72"><animate attributeName="stroke-dasharray" values="0 220;220 0;0 220" dur="7s" repeatCount="indefinite"/></path>
      <path d="M835 126h46l18 -18h120"><animate attributeName="stroke-dasharray" values="220 0;0 220;220 0" dur="8s" repeatCount="indefinite"/></path>
      <path d="M760 230h110l20 -20h90"><animate attributeName="stroke-dasharray" values="0 250;250 0;0 250" dur="9s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#a78bfa" opacity=".9">
      <circle cx="952" cy="96" r="4"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="108" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="210" r="4"><animate attributeName="r" values="4;7;4" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="862" cy="248" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(830 65)" opacity=".16" fill="#c4b5fd" font-family="monospace" font-size="17">
      <text x="0" y="0">public class Developer</text>
      <text x="18" y="29">{</text>
      <text x="36" y="58">string Language = "C#";</text>
      <text x="36" y="87">bool KeepLearning = true;</text>
      <text x="18" y="116">}</text>
    </g>
    <g transform="translate(76 72)">
      <rect x="0" y="0" width="8" height="194" rx="4" fill="url(#accent)"/>
      <text x="34" y="22" fill="#c4b5fd" font-family="monospace" font-size="16" letter-spacing="4">ПРОФИЛЬ РАЗРАБОТЧИКА</text>
      <text x="30" y="91" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">DvoreZZKy<tspan fill="#a78bfa">_</tspan>
        <animate attributeName="opacity" values="1;1;.82;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="130" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="23">Разработчик на C# / .NET</text>
      <text x="34" y="164" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="17">Создаю проекты · Изучаю новое · Пишу код</text>
      <g transform="translate(34 190)">
        <rect width="94" height="30" rx="15" fill="#8b5cf6" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".7"/>
        <text x="47" y="20" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="13">C# / .NET</text>
        <rect x="106" width="76" height="30" rx="15" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".65"/>
        <text x="144" y="20" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="13">Avalonia</text>
        <rect x="194" width="72" height="30" rx="15" fill="#8b5cf6" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/>
        <text x="230" y="20" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="13">MVVM</text>
      </g>
    </g>
    <g transform="translate(1060 180)" filter="url(#softGlow)">
      <circle r="54" fill="#11132b" stroke="url(#accent)" stroke-width="2"/>
      <circle r="43" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="4 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <path d="M-15 -20L-34 0l19 20M15 -20L34 0 15 20M8 -29L-8 29" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1120" y="324" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">dvorezzky.github.io</text>
    <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#a78bfa" stroke-opacity=".25"/>
  </g>
</svg>
